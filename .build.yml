# Script function and purpose: FreeBSD CI for sofi. Builds from source and runs
# the test suite on FreeBSD, which is the project's primary development target.
# GNU bison is required (base byacc cannot build the GLR grammar in
# lexer/theme-parser.y) and is therefore an explicit dependency.
image: freebsd/latest
packages:
  - devel/meson
  - devel/ninja
  - devel/pkgconf
  - devel/bison
  - textproc/flex
  - devel/check
  - devel/glib20
  - graphics/cairo
  - x11-toolkits/pango
  - graphics/gdk-pixbuf2
  - x11/libxkbcommon
  - graphics/wayland
  - graphics/wayland-protocols
  - x11/libxcb
  - x11/xcb-util
  - x11/xcb-util-wm
  - x11/xcb-util-cursor
  - x11/xcb-util-keysyms
  - x11/startup-notification
sources:
  - https://github.com/orpheus497/sofi
tasks:
  - setup: |
      cd sofi
      meson setup builddir .
  - build: |
      ninja -C sofi/builddir
  - test: |
      meson test -C sofi/builddir --print-errorlogs
  - dist: |
      ninja -C sofi/builddir dist
