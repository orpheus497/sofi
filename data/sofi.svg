<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Sofi — the Sakura Official Full Indexer.

  Icon purpose: the application mark for sofi, hikari-sakura's shell. A five-petal
  sakura blossom drawn entirely from the sixteen palette slots in doc/palette.sasi,
  which are byte-identical to hikari-sakura's `ui { palette }`. Five petals for the
  five system surfaces — application menu, task strip, sheet switcher, notifications
  and system tray — around one centre, from one binary.

  Every colour below is a palette slot, named in the comment beside it. Nothing here
  is a one-off tone: recolouring the desktop and recolouring this file are the same
  sixteen values.

  Hand-authored. It carries no editor metadata and no absolute paths, which is the
  other reason it exists — the artwork it replaces was upstream rofi's and embedded
  the upstream author's home directory in an installed asset.

  Read small first: an application icon is seen at 16px before it is seen at 64px,
  so the silhouette carries the meaning and no detail is allowed to compete with it.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64" viewBox="0 0 64 64"
     role="img" aria-label="Sofi">

  <title>Sofi</title>
  <desc>A five-petal sakura blossom in violet on a dark rounded ground.</desc>

  <defs>
    <!--
      Action purpose: shade each petal from its base outwards, so the blossom reads
      as five separate petals rather than one silhouette even where they nearly meet.
      userSpaceOnUse is deliberate — the gradient is resolved in each petal's own
      transformed space, so one definition rotates with all five and every petal is
      lit from the centre outwards rather than all of them from the top of the canvas.
    -->
    <linearGradient id="petal" gradientUnits="userSpaceOnUse"
                    x1="32" y1="29" x2="32" y2="10">
      <stop offset="0"   stop-color="#8e7cc3"/>  <!-- color4  violet        -->
      <stop offset="1"   stop-color="#cfaedc"/>  <!-- color13 bright mauve  -->
    </linearGradient>
  </defs>

  <!--
    Action purpose: the ground is color0, the same value every sofi panel uses for its
    background, so the icon sits in a launcher looking like the surfaces it summons.
    The hairline is color8, which the palette permits for non-text marks only — it is
    here to define the edge when the icon is drawn on a dark desktop, where an
    unstroked color0 square would have no boundary at all.
  -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5"
        fill="#2b1e3a" stroke="#5e5966" stroke-width="1"/>

  <!--
    Action purpose: five petals at 72 degree intervals about the centre. The petal is
    drawn once, pointing up, and rotated; its outline runs up the left edge, dips into
    the notch that makes a cherry blossom recognisable at a glance, and returns down
    the right. Width is held under the arc between neighbours so the petals separate
    without needing a stroke to divide them.
  -->
  <g fill="url(#petal)" transform="translate(32 32) scale(1.12) translate(-32 -32)">
    <path d="M31 30 C27 28 24.2 23 24.6 17.5 C24.9 13.2 27.6 10.8 30 12.8 L32 15 L34 12.8
             C36.4 10.8 39.1 13.2 39.4 17.5 C39.8 23 37 28 33 30 Z"/>
    <path d="M31 30 C27 28 24.2 23 24.6 17.5 C24.9 13.2 27.6 10.8 30 12.8 L32 15 L34 12.8
             C36.4 10.8 39.1 13.2 39.4 17.5 C39.8 23 37 28 33 30 Z"
          transform="rotate(72 32 32)"/>
    <path d="M31 30 C27 28 24.2 23 24.6 17.5 C24.9 13.2 27.6 10.8 30 12.8 L32 15 L34 12.8
             C36.4 10.8 39.1 13.2 39.4 17.5 C39.8 23 37 28 33 30 Z"
          transform="rotate(144 32 32)"/>
    <path d="M31 30 C27 28 24.2 23 24.6 17.5 C24.9 13.2 27.6 10.8 30 12.8 L32 15 L34 12.8
             C36.4 10.8 39.1 13.2 39.4 17.5 C39.8 23 37 28 33 30 Z"
          transform="rotate(216 32 32)"/>
    <path d="M31 30 C27 28 24.2 23 24.6 17.5 C24.9 13.2 27.6 10.8 30 12.8 L32 15 L34 12.8
             C36.4 10.8 39.1 13.2 39.4 17.5 C39.8 23 37 28 33 30 Z"
          transform="rotate(288 32 32)"/>
  </g>

  <!--
    Action purpose: the centre is color11, the palette's bright yellow and the one
    warm note against an otherwise entirely violet mark. It is what the eye lands on
    first and the only element still legible as itself at 16px, which is why it is a
    single filled circle and not a ring or a cluster of stamens.
  -->
  <circle cx="32" cy="32" r="6.7" fill="#f5cf9e"/>
</svg>
