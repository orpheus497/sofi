name: Documentation Report
description: Report a problem in sofi's documentation
labels: [Documentation]
title: "[Doc] "
body:
  - type: markdown
    attributes:
      value: |
        Corrections to the manpages, README, INSTALL or CONFIG are welcome, and
        so are reports that something is simply missing. Please read the
        [contributing guidelines](https://github.com/orpheus497/sofi/blob/master/.github/CONTRIBUTING.md)
        first.

        If you are unsure, open a
        [discussion](https://github.com/orpheus497/sofi/discussions) instead.

  - type: input
    attributes:
      label: "Version"
      description: "Output of `sofi -v`, or the commit you built from."
      placeholder: "Version: 1.0.0"
    validations:
      required: true

  - type: input
    attributes:
      label: "Which document"
      description: "A path or a link — for example doc/sofi-theme.5.markdown, or README.md."
      placeholder: "doc/sofi.1.markdown"
    validations:
      required: true

  - type: textarea
    attributes:
      label: "What is wrong, unclear or missing"
      placeholder: |
        * What I was trying to do
        ..
        * What the documentation says, and why it did not help
        ..
        * What I expected to find
        ..
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Suggested wording"
      description: "Optional. Proposed replacement or additional text."
    validations:
      required: false
