name: Feature Request
description: It'd be cool if sofi did/had/would...
labels: Feature Request
title: "[REQUEST] "
body:
  - type: markdown
    attributes:
      value: |
        Please read the
        [contributing guidelines](https://github.com/orpheus497/sofi/blob/master/.github/CONTRIBUTING.md)
        first, and open a
        [discussion](https://github.com/orpheus497/sofi/discussions) if you would
        rather talk the idea through before filing it.

        sofi is deliberately narrow in scope: it is the shell for the
        hikari-sakura compositor. Requests that make it better at that, or that
        fix something genuinely broken, are the most likely to land. Requesting
        a feature is no guarantee it will be added.

  - type: checkboxes
    id: before-feature-request
    attributes:
      label: Before opening a feature request
      options:
        - label: I checked the latest `master` to see if the feature already exists
          required: true
        - label: I searched existing requests
          required: true

  - type: textarea
    attributes:
      label: "What problem do you want solved?"
      description: "Describe the problem, not only the solution you have in mind."
    validations:
      required: true

  - type: textarea
    attributes:
      label: "How would you expect to use it?"
      description: "A config option, a key binding, a mode, a command-line flag?"
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Who else does this help?"
    validations:
      required: false

  - type: input
    attributes:
      label: "Version"
      description: "Output of `sofi -v`, or the commit you built from."
      placeholder: "Version: 1.0.0"
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Additional information"
    validations:
      required: false
