name: Bug Report
description: Report a problem in sofi
labels: [bug]
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please read the
        [contributing guidelines](https://github.com/orpheus497/sofi/blob/master/.github/CONTRIBUTING.md)
        first.

        If you are not sure whether something is a bug, open a
        [discussion](https://github.com/orpheus497/sofi/discussions) instead —
        it can be promoted to an issue later.

        sofi is a hard fork of rofi and does not track it. Please do not report
        rofi bugs here.

  - type: input
    attributes:
      label: "Version"
      description: "Output of `sofi -v`, or the commit you built from."
      placeholder: "Version: 1.0.0"
    validations:
      required: true

  - type: input
    attributes:
      label: "Compositor or window manager"
      description: |
        Which one, and whether you are running Wayland or X11. If Wayland, this
        matters: sofi uses zwlr_layer_shell_v1 where it is available and falls
        back to xdg-shell where it is not, and placement behaves differently
        between the two.
      placeholder: "hikari-sakura, Wayland"
    validations:
      required: true

  - type: input
    attributes:
      label: "Launch command"
      placeholder: "sofi -show drun"
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        * Step 1
        * Step 2
        * ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Expected behaviour"
      description: "May include logs, images, or videos."
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Actual behaviour"
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Configuration"
      description: |
        If you use a config file or theme, paste the relevant part, or link a
        [gist](https://gist.github.com) with `sofi -info` and `sofi -dump-config`.
        sofi runs with no configuration at all, so please also say whether the
        problem still happens with `-no-config`.
    validations:
      required: false

  - type: textarea
    attributes:
      label: "Timing trace"
      description: |
        For anything involving speed. See sofi-debugging(5) for how to produce
        one, or run your command with `G_MESSAGES_DEBUG=Timings` set.
    validations:
      required: false

  - type: textarea
    attributes:
      label: "Additional information"
    validations:
      required: false

  - type: checkboxes
    id: latest
    attributes:
      label: Built from the latest master
      description: |
        sofi is not packaged by any distribution yet, so there is no released
        version to compare against — please build from the current `master`.
      options:
        - label: "Yes, I reproduced this on the latest master"
          required: false
